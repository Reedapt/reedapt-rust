[package]
name = "reedapt"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "The official Rust library for the Reedapt API: dub video and audio into other languages in each speaker's own voice."
license = "MIT"
repository = "https://github.com/Reedapt/reedapt-rust"
homepage = "https://docs.reedapt.com"
documentation = "https://docs.rs/reedapt"
readme = "README.md"
authors = ["Reedapt"]
keywords = ["reedapt", "dubbing", "api-client", "video", "translation"]
categories = ["api-bindings", "multimedia"]
exclude = [".github/"]

[features]
default = []
# `reedapt::blocking::Client`, for programs that don't use async.
blocking = []

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
wiremock = "0.6"
hmac = "0.12"
sha2 = "0.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
